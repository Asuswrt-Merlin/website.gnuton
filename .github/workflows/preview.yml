name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  pages: read
  deployments: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    # The preview action deploys with the Actions token, so it can only
    # publish previews for branches that live in this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Pages URL
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const fallback = `https://${owner.toLowerCase()}.github.io/${repo}/`
            let siteUrl = fallback
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo })
              siteUrl = data.html_url || fallback
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const url = new URL(siteUrl)
            const basePath = url.pathname.replace(/\/+$/, '')
            core.setOutput('origin', url.origin)
            core.setOutput('base_path', basePath)
            core.setOutput('base_url', `${url.origin}${basePath}`)
            core.setOutput('base_url_no_scheme', `${url.host}${basePath}`)
            core.info(`Pages site: ${url.origin}${basePath}`)

      - name: Install pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Type-check
        if: github.event.action != 'closed'
        run: pnpm check

      - name: Build preview
        if: github.event.action != 'closed'
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Preview lives under the production base path:
          # /<repo>/pr-preview/pr-<number>/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/pr-preview/pr-${{ github.event.pull_request.number }}
          PUBLIC_IS_PREVIEW: 'true'

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
          qr-code: false
          # The action prepends https:// itself; pass host + base path only.
          pages-base-url: ${{ steps.pages.outputs.base_url_no_scheme }}
